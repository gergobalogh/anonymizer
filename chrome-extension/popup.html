<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="title">Anonymizer</span>
      <span class="pair-count" id="pairCount">0 pairs</span>
    </div>

    <div class="toggles">
      <label class="toggle-row">
        <input type="checkbox" id="anonOnPaste" checked>
        <span>Anonymize on paste</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="deanonOnCopy" checked>
        <span>Deanonymize on copy</span>
      </label>
    </div>

    <div class="footer">
      <button class="btn-link" id="openOptions">Manage word pairs &#8594;</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
